name: Auto-merge Claude branches

on:
  push:
    branches:
      - 'claude/**'

# Serialize merges. Several Claude branches routinely push within seconds of
# each other; without this, two runs race to push main and the loser fails with
# a non-fast-forward that nothing surfaces.
concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge to main
        run: |
          set -e

          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Merging $BRANCH_NAME into main..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main "$BRANCH_NAME"
            git checkout -B main origin/main

            if ! git merge --no-ff "origin/$BRANCH_NAME" -m "Auto-merge: ${BRANCH_NAME}"; then
              git merge --abort || true
              echo "::error::Real conflict between $BRANCH_NAME and main. Resolve it on the branch, then push again."
              exit 1
            fi

            if git push origin main; then
              echo "Merged $BRANCH_NAME into main."
              exit 0
            fi

            echo "Push rejected -- main moved underneath us. Retrying ($attempt/3)."
            sleep 5
          done

          echo "::error::Could not push to main after 3 attempts."
          exit 1
